<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PXL – Lệnh vận chuyển</title>
<style>
  :root { --xanh:#0a7d32; --cam:#b45309; --do:#b91c1c; --lam:#1d4ed8; --chu:#111; --nen:#f4f4f0; }
  * { box-sizing:border-box; }
  body { margin:0; font:20px/1.45 system-ui, Roboto, Arial, sans-serif; color:var(--chu); background:var(--nen); }
  #tt { position:sticky; top:0; z-index:9; padding:12px 16px; font-weight:700; color:#fff; background:#555; }
  main { max-width:560px; margin:auto; padding:12px 12px 40px; }
  .the { background:#fff; border:2px solid #ddd; border-radius:12px; padding:14px; margin-bottom:12px; }
  h1 { font-size:28px; margin:0 0 4px; }
  h2 { font-size:22px; margin:0 0 6px; }
  .nho { font-size:18px; color:#444; }
  .moc { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .xong { border-color:var(--xanh); }
  .cho { border-color:var(--cam); }
  .mo { opacity:.45; }
  .loi { color:var(--do); font-weight:700; border-color:var(--do); }
  input, textarea { width:100%; margin-top:8px; padding:12px; font-size:26px; border:2px solid #888; border-radius:10px; }
  textarea { font-size:20px; }
  button { width:100%; min-height:60px; margin-top:10px; font-size:22px; font-weight:700; border:0; border-radius:12px; color:#fff; background:var(--lam); }
  button.phu { background:#374151; }
  button.xanh { background:var(--xanh); }
  .chip { display:inline-block; width:auto; min-height:48px; margin:6px 6px 0 0; padding:8px 14px; font-size:18px; font-weight:600; color:#111; background:#e5e7eb; border:2px solid #bbb; }
  .chip.chon { background:#fde68a; border-color:var(--cam); }
  .chip.da { background:#dcfce7; border-color:var(--xanh); }
  .anh { width:72px; height:72px; object-fit:cover; margin:6px 6px 0 0; border-radius:6px; vertical-align:middle; }
  .o { display:flex; align-items:center; gap:8px; margin-top:8px; }
  .o button { flex:1; margin-top:0; font-size:18px; min-height:56px; text-align:left; padding:0 14px; }
  .o button.co { background:var(--xanh); }
  .kien { border-left:8px solid var(--cam); }
  .kien.du { border-left-color:var(--xanh); }
  .tab { display:flex; gap:8px; }
  .tab button { margin-top:0; min-height:52px; font-size:18px; background:#e5e7eb; color:#111; border:2px solid #bbb; }
  .tab button.chon { background:var(--lam); color:#fff; border-color:var(--lam); }
</style>
</head>
<body>
<div id="tt">Đang tải…</div>
<main id="app"></main>
<input id="f" type="file" accept="image/*" capture="environment" hidden>
<script>
const API = 'https://script.google.com/macros/s/AKfycbxcZsyg5705dew0XQGE-pjvEgNkhj_X8UAuJCkn6jvnoYwk-H6vJeKlxzp350luD9U/exec';
const ID  = new URLSearchParams(location.search).get('id') || '';
const KH  = new URLSearchParams(location.search).get('kh') === '1';   // link kiểm hàng: chỉ chụp biên bản + ảnh kiện
const KT  = 'pxl_trip_' + ID;                         // thông tin chuyến lưu sẵn để mở khi mất sóng
const TEN_DAU = ['① Odo trước khi đổ', '② Odo sau khi đổ', '③ Trụ bơm hiện số 00', '④ Trụ bơm số lít đã bơm', '⑤ Xe thấy rõ biển số', '⑥ Hoá đơn (nếu đổ ngoài)'];
let trip = JSON.parse(localStorage.getItem(KT) || 'null');
let Q = [];                                           // hàng đợi chờ gửi (đọc từ IndexedDB)
let anhOdo = null, lyDo = [], gc = '';
let bb = { NHAN: [], GIAO: [] }, dau = [null, null, null, null, null, null], lit = '', veAnh = [], phi = '';
let chuaKien = {}, dauXem = null;                       // ảnh kiện chưa gửi: khoá 'NHAN|id' → { ma, anh, tt, gc }
let loiGui = '', daGuiLuc = null, kmCuoi = 0, dangGui = false, choAnh = null;
localStorage.removeItem('pxl_q');                     // hàng đợi bản cũ (không có ảnh) – bỏ

/* ---------- Hàng đợi trong IndexedDB (giữ được nhiều ảnh khi mất sóng) ---------- */
const DB = new Promise((ok, loi) => {
  const r = indexedDB.open('pxl', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('q', { keyPath: 'k', autoIncrement: true });
  r.onsuccess = () => ok(r.result);
  r.onerror = () => loi(r.error);
});
async function kho(mode, f) {
  const db = await DB;
  return new Promise((ok, loi) => {
    const t = db.transaction('q', mode), r = f(t.objectStore('q'));
    t.oncomplete = () => ok(r && r.result);
    t.onerror = () => loi(t.error);
  });
}
async function napQ() { Q = await kho('readonly', s => s.getAll()); }
async function themQ(x) { await kho('readwrite', s => s.add(x)); await napQ(); }
async function xoaQ(k) { await kho('readwrite', s => s.delete(k)); await napQ(); }
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();

/* ---------- Tiện ích ---------- */
const so = n => Number(n).toLocaleString('vi-VN');
const coKm = m => m.km !== '' && m.km != null;
const p2 = n => String(n).padStart(2, '0');
const gioNgan = d => { const t = new Date(d); return p2(t.getDate()) + '/' + p2(t.getMonth() + 1) + ' ' + p2(t.getHours()) + ':' + p2(t.getMinutes()); };
const maLuot = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const chiSo = s => Number(String(s).replace(/\D/g, ''));
const _url = new WeakMap();
const hinh = b => { if (!_url.has(b)) _url.set(b, URL.createObjectURL(b)); return `<img class="anh" src="${_url.get(b)}">`; };
const cuaToi = loai => Q.filter(x => x.id === ID && (x.loai || 'km') === loai);
const CHU = { NHAN: 'nhận', GIAO: 'giao' };
const soBB = d => (d === 'NHAN' ? (trip.so_bb_nhan || 0) : (trip.so_bbgn || 0)) + cuaToi('bbgn').filter(x => (x.dau || 'GIAO') === d).length;
const choKien = (k, d) => cuaToi('kien').filter(x => x.ckl === k.id && x.dau === d);
const soAnhKien = (k, d) => (d === 'NHAN' ? k.nhan : k.giao) + choKien(k, d).reduce((s, x) => s + x.anh.length + (x.anh_ma ? 1 : 0), 0);
const coMaKien = (k, d) => (d === 'NHAN' ? k.ma_nhan : k.ma_giao) || choKien(k, d).some(x => x.anh_ma);
const duKien = (k, d) => coMaKien(k, d) && soAnhKien(k, d) >= trip.so_anh_kien;
const thieuKien = d => (trip.kien || []).filter(k => !duKien(k, d));
const ck = (d, id) => chuaKien[d + '|' + id] || (chuaKien[d + '|' + id] = { ma: null, anh: [], tt: '', gc: '' });
const coCho = c => c.ma || c.anh.length || c.tt;
// Hàng dự án: trước mốc Điểm nhận (1) / Điểm giao (2) phải có biên bản + đủ ảnh từng kiện ở đầu đó
function thieuMoc(i) {
  if (!trip.theo_kien || (i !== 1 && i !== 2)) return '';
  const d = i === 1 ? 'NHAN' : 'GIAO';
  if (!(trip.kien || []).length) return 'Lệnh chưa có kiện hàng, bác gọi điều độ';
  const t = [];
  if (!soBB(d)) t.push('biên bản ' + CHU[d]);
  const k = thieuKien(d);
  if (k.length) t.push('ảnh ' + k.length + ' kiện');
  return t.length ? 'Chưa đủ ' + t.join(' và ') + ' (khung Kiểm hàng phía dưới)' : '';
}

// Nén ảnh: rộng tối đa 1024px, JPEG 0.6 (~150–250KB)
function nen(f) {
  return new Promise((ok, loi) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 1024 / img.width);
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(img.src);
      cv.toBlob(b => b ? ok(b) : loi(), 'image/jpeg', 0.6);
    };
    img.onerror = loi;
    img.src = URL.createObjectURL(f);
  });
}
const b64 = b => new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result.split(',')[1]); r.readAsDataURL(b); });

// Mở camera; ảnh chụp xong đưa vào hàm nhận
function chup(nhan) { choAnh = nhan; const f = document.getElementById('f'); f.value = ''; f.click(); }
document.getElementById('f').onchange = async e => {
  const file = e.target.files[0];
  if (!file || !choAnh) return;
  try { choAnh(await nen(file)); } catch (_) { alert('Không đọc được ảnh, bác chụp lại giúp cháu'); }
  ve();
};

/* ---------- Tải chuyến ---------- */
function trangThai(chu, mau) { const t = document.getElementById('tt'); t.textContent = chu; t.style.background = mau; }
function capNhatTT() {
  if (Q.length) trangThai('⏳ Đã lưu trên máy, chờ sóng để gửi (' + Q.length + ')', 'var(--cam)');
  else if (daGuiLuc) trangThai('✔ Đã gửi về điều độ lúc ' + p2(daGuiLuc.getHours()) + ':' + p2(daGuiLuc.getMinutes()), 'var(--xanh)');
  else if (navigator.onLine) trangThai('✔ Đã kết nối', 'var(--xanh)');
  else trangThai('Mất sóng – vẫn nhập và chụp bình thường', 'var(--cam)');
}
async function taiChuyen() {
  if (!ID) { trangThai('Link thiếu mã chuyến – bác gọi điều độ', 'var(--do)'); return; }
  try {
    const r = await (await fetch(API + '?id=' + encodeURIComponent(ID))).json();
    if (!r.ok) { trangThai(r.loi, 'var(--do)'); return; }
    trip = r;
    localStorage.setItem(KT, JSON.stringify(r));
  } catch (e) { /* mất sóng: dùng bản đã lưu */ }
  ve(); capNhatTT();
}

/* ---------- Vẽ trang ---------- */
function ve() {
  const app = document.getElementById('app');
  if (!trip) { app.innerHTML = '<div class="the">Chưa tải được chuyến. Bác mở lại khi có sóng.</div>'; return; }
  const giuKm = (document.getElementById('km') || {}).value || '';

  const choKm = cuaToi('km');
  const moc = trip.moc.map((m, i) => {
    const p = choKm.find(x => x.moc === i);
    return p ? { ...m, km: p.km, gio: gioNgan(p.gio), cho: true } : m;
  });
  const daCo = moc.filter(coKm), tiep = moc.findIndex(m => !coKm(m));
  kmCuoi = daCo.length ? Number(daCo[daCo.length - 1].km) : 0;
  const coBBGN = soBB('GIAO');
  const lyDoDaCo = (trip.ly_do_da_co || []).concat(...choKm.map(x => x.ly_do || []));

  let h = `<div class="the"><h1>${trip.ma_lenh}</h1>
    <div><b>${trip.loai_hang}</b> – ${trip.khoi_luong}</div>
    <div class="nho">${trip.xe.join('<br>')}</div>
    <div class="nho">Lái xe: ${trip.lai_xe}</div></div>
    <div class="the">
      <div>📦 <b>Nhận:</b> ${trip.diem_nhan}</div><div class="nho">Kế hoạch: ${trip.kh_nhan}</div>
      <div style="margin-top:8px">🏁 <b>Giao:</b> ${trip.diem_giao}</div><div class="nho">Kế hoạch: ${trip.kh_giao}</div>
      ${trip.tuyen_duong ? `<div class="nho" style="margin-top:8px">Tuyến: ${trip.tuyen_duong}</div>` : ''}
      ${trip.ghi_chu ? `<div style="margin-top:8px;padding:8px;background:#fef3c7;border-radius:8px">📝 ${trip.ghi_chu}</div>` : ''}
    </div>`;

  const dauMacDinh = coKm(moc[1]) ? 'GIAO' : 'NHAN';
  if (KH) {                                            // link kiểm hàng: không có km, dầu, vé
    h += trip.theo_kien ? veKiemHang(dauXem || dauMacDinh) : `<div class="the">Lệnh này không phải hàng dự án, không cần kiểm từng kiện.</div>`;
    if (loiGui) h += `<div class="the loi">${loiGui}</div>`;
    app.innerHTML = h;
    return;
  }

  // 4 mốc km
  moc.forEach((m, i) => {
    if (coKm(m)) {
      h += `<div class="the moc ${m.cho ? 'cho' : 'xong'}"><span>${i + 1}. ${m.ten}</span>
        <b style="text-align:right">${m.cho ? '⏳' : '✔'} ${so(m.km)} km<br><span class="nho">${m.gio}${m.cho ? ' – chờ sóng' : ''}</span></b></div>`;
    } else if (i === tiep) {
      h += `<div class="the"><label for="km"><b>${i + 1}. Km lúc ${m.ten.toLowerCase()}</b></label>
        <input id="km" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="${kmCuoi ? 'Lớn hơn ' + so(kmCuoi) : 'Số trên đồng hồ'}">
        <div class="o"><button class="${anhOdo ? 'co' : 'phu'}" onclick="chup(b => anhOdo = b)">📷 ${anhOdo ? 'Chụp lại đồng hồ' : 'Chụp đồng hồ km'}</button>${anhOdo ? hinh(anhOdo) : ''}</div>
        ${i === 3 && !coBBGN ? `<div class="loi" style="margin-top:8px">Bác gửi biên bản giao nhận (phía dưới) trước khi hoàn thành chuyến</div>` : ''}
        ${thieuMoc(i) ? `<div class="loi" style="margin-top:8px">${thieuMoc(i)}</div>` : ''}</div>`;
    } else {
      h += `<div class="the mo">${i + 1}. ${m.ten} – chưa tới</div>`;
    }
  });
  if (daCo.length >= 2) h += `<div class="the">Đã chạy: <b>${so(kmCuoi - Number(daCo[0].km))} km</b></div>`;
  if (loiGui) h += `<div class="the loi">${loiGui}</div>`;

  if (tiep >= 0) {
    h += `<div class="the"><b>Bị trễ? (không bắt buộc, chọn được nhiều)</b><div>
      ${trip.ds_ly_do.map(l => lyDoDaCo.includes(l.ma)
          ? `<button class="chip da" disabled>✔ ${l.ten}</button>`
          : `<button class="chip ${lyDo.includes(l.ma) ? 'chon' : ''}" onclick="chonLyDo('${l.ma}')">${l.ten}</button>`).join('')}
      </div><textarea id="gc" rows="2" placeholder="Ghi chú thêm (nếu có)" oninput="gc=this.value">${gc}</textarea></div>
      <button onclick="luuKm(${tiep})">${tiep === 3 ? 'LƯU & HOÀN THÀNH CHUYẾN' : 'LƯU CẬP NHẬT'}</button>`;
  } else {
    h += `<div class="the xong"><b>✔ Chuyến đã hoàn thành. Cảm ơn bác!</b></div>`;
  }

  // Hàng dự án: khung kiểm hàng (biên bản + ảnh từng kiện). Hàng thường: 1 biên bản giao nhận
  if (trip.theo_kien) h += `<div style="margin-top:24px"></div>` + veKiemHang(dauXem || dauMacDinh);
  else h += `<div class="the" style="margin-top:24px"><h2>📄 Biên bản giao nhận</h2>
    <div class="nho">${coBBGN ? '✔ Đã có ' + coBBGN + ' lần gửi' + (cuaToi('bbgn').length ? ' (đang chờ sóng)' : '') : 'Chưa có – bắt buộc trước khi về bãi'}</div>
    <div>${bb.GIAO.map(hinh).join('')}</div>
    <button class="phu" onclick="chup(b => bb.GIAO.push(b))">📷 Chụp ${bb.GIAO.length ? 'thêm trang' : 'biên bản'} (${bb.GIAO.length})</button>
    ${bb.GIAO.length ? `<button class="xanh" onclick="guiBBGN('GIAO')">GỬI BIÊN BẢN</button>` : ''}</div>`;

  // Đổ dầu
  const soDau = (trip.so_lan_dau || 0) + cuaToi('dau').length;
  h += `<div class="the"><h2>⛽ Đổ dầu</h2>
    ${soDau ? `<div class="nho">Đã gửi ${soDau} lần</div>` : ''}
    ${TEN_DAU.map((t, k) => `<div class="o"><button class="${dau[k] ? 'co' : 'phu'}" onclick="chup(b => dau[${k}] = b)">${dau[k] ? '✔ ' : '📷 '}${t}</button>${dau[k] ? hinh(dau[k]) : ''}</div>`).join('')}
    <input id="lit" inputmode="decimal" autocomplete="off" placeholder="Số lít đã bơm (xem ảnh ④)" value="${lit}" oninput="lit=this.value">
    <button class="xanh" onclick="guiDau()">GỬI ẢNH ĐỔ DẦU</button></div>`;

  // Vé cầu đường
  h += `<div class="the"><h2>🧾 Vé cầu đường</h2>
    ${trip.phi_cau_duong ? `<div class="nho">Đã gửi tổng: ${so(trip.phi_cau_duong)} đồng</div>` : ''}
    ${cuaToi('ve').length ? `<div class="nho" style="color:var(--cam)">⏳ ${cuaToi('ve').length} lượt vé đang chờ sóng</div>` : ''}
    <div>${veAnh.map(hinh).join('')}</div>
    <button class="phu" onclick="chup(b => veAnh.push(b))">📷 Chụp vé (${veAnh.length})</button>
    <input id="phi" inputmode="numeric" autocomplete="off" placeholder="Số tiền (đồng)" value="${phi}" oninput="phi=this.value">
    <button class="xanh" onclick="guiVe()">GỬI ẢNH & PHÍ CẦU ĐƯỜNG</button></div>`;

  app.innerHTML = h;
  const k = document.getElementById('km'); if (k) k.value = giuKm;
}

/* ---------- Kiểm hàng (hàng dự án) ---------- */
function veKiemHang(d) {
  const ds = trip.kien || [], n = trip.so_anh_kien, du = ds.length - thieuKien(d).length;
  const choBB = cuaToi('bbgn').filter(x => (x.dau || 'GIAO') === d).length;
  let h = `<div class="the"><h2>📦 Kiểm hàng</h2>
    <div class="tab"><button class="${d === 'NHAN' ? 'chon' : ''}" onclick="dauXem='NHAN';ve()">Đầu nhận</button>
      <button class="${d === 'GIAO' ? 'chon' : ''}" onclick="dauXem='GIAO';ve()">Đầu giao</button></div>
    <div style="margin-top:8px"><b>${d === 'NHAN' ? trip.diem_nhan : trip.diem_giao}</b></div>
    <div class="nho">Mỗi kiện: <b>1 ảnh đọc rõ mã kiện / số khung</b> + ảnh toàn cảnh. Hàng dài: chụp thêm dọc thân và các góc.</div>
    <div class="nho">Đủ ảnh: <b>${du}/${ds.length} kiện</b> · Biên bản: <b>${soBB(d) ? '✔' : 'chưa có'}</b></div></div>`;
  h += `<div class="the ${soBB(d) ? 'xong' : 'cho'}"><b>📄 Biên bản ${CHU[d]} hàng</b>
    <div class="nho">${soBB(d) ? '✔ Đã có ' + soBB(d) + ' lần gửi' + (choBB ? ' (đang chờ sóng)' : '') : 'Chưa có – bắt buộc'}</div>
    <div>${bb[d].map(hinh).join('')}</div>
    <button class="phu" onclick="chup(b => bb.${d}.push(b))">📷 Chụp ${bb[d].length ? 'thêm trang' : 'biên bản'} (${bb[d].length})</button>
    ${bb[d].length ? `<button class="xanh" onclick="guiBBGN('${d}')">GỬI BIÊN BẢN</button>` : ''}</div>`;
  if (!ds.length) h += `<div class="the loi">Lệnh chưa có kiện hàng. Bác gọi điều độ thêm kiện vào lệnh.</div>`;
  ds.forEach(k => {
    const c = ck(d, k.id), so = soAnhKien(k, d), tt = c.tt || k.tinh_trang, du = duKien(k, d), coMa = coMaKien(k, d);
    const nhanSo = du ? '✔ ' + so + ' ảnh' : !coMa && !c.ma ? 'Thiếu ảnh mã' : 'Thiếu ' + Math.max(1, n - so - c.anh.length - (c.ma ? 1 : 0)) + ' ảnh';
    h += `<div class="the kien ${du ? 'du' : ''}">
      <div class="moc"><span><b>${k.ma}</b><br><span class="nho">${k.loai}</span></span>
        <b style="text-align:right;color:${du ? 'var(--xanh)' : 'var(--cam)'}">${nhanSo}</b></div>
      <div class="o"><button class="${c.ma || coMa ? 'co' : 'phu'}" onclick="chup(b => ck('${d}','${k.id}').ma = b)">${c.ma || coMa ? '✔' : '🔢'} Ảnh mã kiện / số khung${coMa && !c.ma ? ' (đã có, chụp lại nếu mờ)' : ''}</button>${c.ma ? hinh(c.ma) : ''}</div>
      <div>${c.anh.map(hinh).join('')}</div>
      <button class="phu" onclick="chup(b => ck('${d}','${k.id}').anh.push(b))">📷 Ảnh toàn cảnh, dọc thân, các góc (${c.anh.length})</button>
      <div>${['Bình thường', 'Hư hỏng', 'Thiếu'].map(t => `<button class="chip ${tt === t ? (c.tt ? 'chon' : 'da') : ''}" onclick="chonTT('${d}','${k.id}','${t}')">${t}</button>`).join('')}</div>
      ${tt === 'Hư hỏng' || tt === 'Thiếu' ? `<textarea rows="2" placeholder="Mô tả (hư chỗ nào, thiếu gì)" oninput="ck('${d}','${k.id}').gc=this.value">${c.gc}</textarea>` : ''}
      ${coCho(c) ? `<button class="xanh" onclick="guiKien('${d}','${k.id}')">GỬI KIỆN NÀY</button>` : ''}</div>`;
  });
  const cho = ds.filter(k => coCho(ck(d, k.id)));
  if (cho.length > 1) h += `<button class="xanh" onclick="guiTatCa('${d}')">GỬI TẤT CẢ (${cho.length} kiện)</button>`;
  return h;
}
function chonTT(d, id, t) { const c = ck(d, id); c.tt = c.tt === t ? '' : t; ve(); }
function goiKien(d, id) {
  const c = ck(d, id);
  return { loai: 'kien', dau: d, ckl: id, anh_ma: c.ma, anh: c.anh, tinh_trang: c.tt, ghi_chu: c.gc };
}
async function guiKien(d, id) {
  if (await datVao(goiKien(d, id))) { delete chuaKien[d + '|' + id]; ve(); }
}
async function guiTatCa(d) {
  const ds = (trip.kien || []).filter(k => coCho(ck(d, k.id)));
  if (!confirm('Gửi ảnh ' + ds.length + ' kiện?')) return;
  for (const k of ds) if (await datVao(goiKien(d, k.id))) delete chuaKien[d + '|' + k.id];
  ve();
}

function chonLyDo(ma) { lyDo = lyDo.includes(ma) ? lyDo.filter(x => x !== ma) : lyDo.concat(ma); ve(); }

/* ---------- Lưu (vào hàng đợi rồi gửi) ---------- */
async function datVao(x) {
  try { await themQ({ ...x, id: ID, op: maLuot(), gio: new Date().toISOString() }); }
  catch (e) { alert('Máy hết chỗ lưu tạm. Bác đợi có sóng rồi gửi lại.'); return false; }
  loiGui = ''; ve(); capNhatTT(); gui();
  return true;
}

async function luuKm(i) {
  const km = chiSo((document.getElementById('km') || {}).value || '');
  if (!(km > 0)) { alert('Bác nhập số km trên đồng hồ'); return; }
  if (kmCuoi && km < kmCuoi) { alert('Số km phải lớn hơn ' + so(kmCuoi)); return; }
  if (!anhOdo) { alert('Bác chụp ảnh đồng hồ km trước khi lưu'); return; }
  if (i === 3 && !soBB('GIAO')) { alert('Bác gửi biên bản giao nhận trước khi hoàn thành chuyến'); return; }
  if (thieuMoc(i)) { alert(thieuMoc(i)); return; }
  if (!confirm('Lưu ' + so(km) + ' km cho mốc "' + trip.moc[i].ten + '"?')) return;
  document.getElementById('km').value = '';
  const ok = await datVao({ loai: 'km', moc: i, km: km, anh: anhOdo, ly_do: lyDo, ghi_chu_tai_xe: gc });
  if (ok) { anhOdo = null; lyDo = []; gc = ''; ve(); }
}

async function guiBBGN(d) {
  if (!bb[d].length) return;
  if (!confirm('Gửi ' + bb[d].length + ' ảnh biên bản ' + CHU[d] + '?')) return;
  if (await datVao({ loai: 'bbgn', dau: d, anh: bb[d] })) { bb[d] = []; ve(); }
}

async function guiDau() {
  const thieu = [0, 1, 2, 3, 4].filter(k => !dau[k]);
  if (thieu.length) { alert('Bác chụp đủ ảnh ' + thieu.map(k => k + 1).join(', ')); return; }
  const l = Number(String(lit).replace(',', '.').replace(/[^\d.]/g, ''));
  if (!(l > 0)) { alert('Bác nhập số lít đã bơm'); return; }
  if (!confirm('Gửi ảnh đổ dầu, ' + so(l) + ' lít?')) return;
  if (await datVao({ loai: 'dau', anh: dau, lit: l })) { dau = [null, null, null, null, null, null]; lit = ''; ve(); }
}

async function guiVe() {
  const p = chiSo(phi);
  if (!veAnh.length) { alert('Bác chụp ít nhất 1 ảnh vé'); return; }
  if (!confirm('Gửi ' + veAnh.length + ' ảnh vé' + (p ? ', phí ' + so(p) + ' đồng' : '') + '?')) return;
  if (await datVao({ loai: 've', anh: veAnh, phi: p })) { veAnh = []; phi = ''; ve(); }
}

/* ---------- Gửi lần lượt; mất sóng thì dừng, lần sau gửi tiếp ---------- */
async function gui() {
  if (dangGui) return;
  dangGui = true;
  try {
    await napQ();
    while (Q.length) {
      const x = Q[0], y = { ...x };
      delete y.k;
      if (y.anh_ma) y.anh_ma = await b64(y.anh_ma);
      if (y.anh instanceof Blob) y.anh = await b64(y.anh);
      else if (Array.isArray(y.anh)) y.anh = await Promise.all(y.anh.map(a => a ? b64(a) : null));
      let r;
      try { r = await (await fetch(API, { method: 'POST', body: JSON.stringify(y) })).json(); }
      catch (e) { break; }
      if (!r.ok && r.thu_lai) break;
      if (!r.ok && x.id === ID) loiGui = 'Không gửi được (' + ({ km: 'mốc ' + (x.moc + 1), bbgn: 'biên bản', dau: 'đổ dầu', ve: 'vé', kien: 'ảnh kiện' }[x.loai]) + '): ' + r.loi + '. Bác làm lại hoặc gọi điều độ.';
      if (r.ok) daGuiLuc = new Date();
      await xoaQ(x.k);
    }
  } finally { dangGui = false; }
  await taiChuyen();
}

window.addEventListener('online', gui);
window.addEventListener('offline', capNhatTT);
setInterval(() => { if (Q.length) gui(); }, 15000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
napQ().then(() => { ve(); capNhatTT(); return taiChuyen(); }).then(gui);
</script>
